name: UI library and explorer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: explorer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm tokens:build
      - run: git diff --exit-code -- packages/tokens swift/Sources/SaaSMakerUI/Tokens.generated.swift
      - run: pnpm storybook:build
      - run: pnpm exec shadcn build --output explorer/storybook-static/r
      - run: pnpm check:explorer --built
      - uses: actions/upload-artifact@v4
        with:
          name: explorer-preview
          path: explorer/storybook-static
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: explorer/storybook-static
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
