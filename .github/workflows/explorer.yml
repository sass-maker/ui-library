name: UI library and explorer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      updateVisuals:
        description: Generate candidate visual baselines for review
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: explorer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Retained visual baselines were reviewed on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm tokens:build
      - run: git diff --exit-code -- packages/tokens swift/Sources/SaaSMakerUI/Tokens.generated.swift
      - run: pnpm storybook:build
      - run: pnpm exec shadcn build --output explorer/storybook-static/r
      - run: pnpm check:explorer --built
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Browser interactions and approved visual baselines
        if: ${{ !inputs.updateVisuals }}
        run: pnpm test:browser
      - name: Generate candidate baselines for review
        if: ${{ inputs.updateVisuals }}
        run: pnpm test:browser --update-snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: |
            playwright-report
            test-results
            explorer/browser/baselines/linux
      - name: Check deployed subdirectory layout and demo assets
        env:
          BASE_URL: http://127.0.0.1:4175/ui-library
          CHROME: /usr/bin/google-chrome
        run: |
          mkdir -p "$RUNNER_TEMP/explorer-preview"
          ln -s "$PWD/explorer/storybook-static" "$RUNNER_TEMP/explorer-preview/ui-library"
          python3 -m http.server 4175 --bind 127.0.0.1 --directory "$RUNNER_TEMP/explorer-preview" > "$RUNNER_TEMP/explorer-server.log" 2>&1 &
          pnpm check:browser:explorer
      - uses: actions/upload-artifact@v4
        with:
          name: explorer-preview
          path: explorer/storybook-static
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: explorer/storybook-static
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
