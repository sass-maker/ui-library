name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deploy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/deploy.test.mjs

  worker-sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/worker-sites.test.mjs
      - run: pnpm check:worker-sites

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [kith, setline, anchor, motion, calorie, journal, habits, storagedaddy, performancedaddy, browserdaddy, contextdaddy]
    env:
      PRODUCT: ${{ matrix.product }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:one
